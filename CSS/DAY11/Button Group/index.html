<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Group</title>
    <link rel="stylesheet" href="	https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" />
</head>

<body>

    <div class="container">
        <div class="btn-group">
            <button class="btn btn-primary">Left</button>
            <button class="btn btn-primary">Middle</button>
            <button class="btn btn-primary">Right</button>
        </div>

        <hr>
        <p>Active link group buttons</p>
        <div class="btn-group">
            <a href="#" class="btn btn-primary active">Active link</a>
            <a href="#" class="btn btn-primary">Link</a>
            <a href="#" class="btn btn-primary">Link</a>
        </div>

        <hr>
        <p>Mixed Styles</p>
        <div class="btn-group">
            <button class="btn btn-danger">Left</button>
            <button class="btn btn-warning">Middle</button>
            <button class="btn btn-success">Right</button>
        </div>


        <hr>
        <p>Outlined Example</p>
        <div class="btn-group">
            <button class="btn btn-outline-danger">Left</button>
            <button class="btn btn-outline-warning">Middle</button>
            <button class="btn btn-outline-success">Right</button>
        </div>



    </div>


</body>

</html>
