<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Badges in Bootstrap</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" />

</head>
<body>

    <div class="container">
        <h1>Badges</h1>

        <hr>
        <p>Heading</p>
        <div class="container">
            <h1>Example heading <span class="badge text-bg-primary">New</span></h1>
            <h2>Example heading <span class="badge text-bg-primary">New</span></h2>
            <h3>Example heading <span class="badge text-bg-primary">New</span></h3>
            <h4>Example heading <span class="badge text-bg-primary">New</span></h4>
            <h5>Example heading <span class="badge text-bg-primary">New</span></h5>
            <h6>Example heading <span class="badge text-bg-primary">New</span></h6>
        </div>

        <hr>
        <p>Badges as buttons</p>
        <div class="container">
            <button class="btn btn-primary">
                Notification <span class="badge text-bg-secondary">4</span>
            </button>
        </div>

        <hr>
        <p>Positioned Badge</p>
        <div class="container">
            <button class="m-3 btn btn-primary position-relative">
                Inbox
                <span class="badge position-absolute top-0 start-100 rounded-pill translate-middle bg-danger">
                    99+
                </span>
            </button>

            <button class="btn btn-primary position-relative">
                Profile
                <span class="badge position-absolute top-0 start-100 border border-light p-2 rounded-circle translate-middle bg-danger">
                    <!-- <span class="visually-hidden">New alert</span> -->
                </span>
            </button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    
</body>
</html>
